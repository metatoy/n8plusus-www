<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nathan H O'Brien — Résumé · N8+US</title>
    <meta name="description" content="Résumé of Nathan H O'Brien — Staff Software Engineer, Creative Engineering, AI-Native / Agentic Systems." />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Nathan H O'Brien — Résumé" />
    <meta property="og:description" content="Staff Software Engineer · Creative Engineering · AI-Native / Agentic Systems." />
    <meta property="og:image" content="https://n8plusus.com/assets/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#231f20; --ink2:#1a1718; --gray:#333132;
        --green:#8dc63f; --green-dim:#5f8a2a;
        --white:#f4f2ec; --muted:#9d9a92; --card:#e8e2d2;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
        background:var(--ink); color:var(--white);
        font-family:"Space Grotesk",system-ui,sans-serif; line-height:1.55;
        -webkit-font-smoothing:antialiased;
      }
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
      body::before{
        content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
        background:repeating-linear-gradient(0deg,rgba(141,198,63,0.03) 0px,rgba(141,198,63,0.03) 1px,transparent 1px,transparent 3px);
        mix-blend-mode:screen;opacity:.5;
      }
      .topbar{
        position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:20px;
        padding:18px 32px;border-bottom:1px solid rgba(141,198,63,0.14);
      }
      .topbar .mark{display:flex;align-items:center;gap:12px;}
      .topbar svg{width:26px;height:auto;display:block;flex:none;}
      .topbar .idline{font-size:12.5px;letter-spacing:.02em;color:var(--muted);}
      .topbar .idline b{font-weight:700;color:var(--white);}
      .topnav{display:flex;gap:18px;align-items:center;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
      .topnav a{color:var(--muted);text-decoration:none;transition:color .18s;}
      .topnav a:hover{color:var(--green);}

      .sheet{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:52px 32px 90px;}
      .prompt{color:var(--green);font-size:12.5px;letter-spacing:.04em;display:flex;align-items:center;gap:9px;margin-bottom:22px;}
      .prompt .blink{width:8px;height:15px;background:var(--green);display:inline-block;animation:blink 1.1s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}

      header.name h1{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-0.015em;margin:0;}
      header.name .title{color:var(--green);font-size:15px;margin-top:10px;font-weight:600;letter-spacing:.01em;text-shadow:0 0 20px rgba(141,198,63,0.35);}
      header.name .contact{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;}
      header.name .contact a{color:var(--white);text-decoration:none;border-bottom:1px solid rgba(141,198,63,0.35);}
      header.name .contact a:hover{color:var(--green);}
      header.name .loc{color:var(--muted);}

      .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 8px;}
      .btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--ink);font-weight:700;
        font-family:"JetBrains Mono",monospace;font-size:12.5px;letter-spacing:.02em;padding:11px 16px;border-radius:6px;
        text-decoration:none;border:none;cursor:pointer;transition:box-shadow .2s,transform .12s;}
      .btn:hover{box-shadow:0 0 24px rgba(141,198,63,0.5);transform:translateY(-1px);}
      .btn-ghost{background:transparent;color:var(--white);border:1px solid rgba(244,242,236,0.28);}
      .btn-ghost:hover{border-color:var(--green);color:var(--green);box-shadow:none;}

      .section-label{color:var(--green-dim);font-size:11px;letter-spacing:.16em;margin:38px 0 14px;
        padding-bottom:8px;border-bottom:1px solid rgba(141,198,63,0.14);}
      .summary{font-size:15.5px;color:#d7d4cc;margin:22px 0 0;}

      .job{margin-top:6px;}
      .job-head,.role-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;}
      .job-head h3{font-size:20px;margin:18px 0 0;font-weight:700;}
      .job-meta{color:var(--muted);font-size:11.5px;letter-spacing:.02em;}
      .role{margin-top:16px;}
      .role-head h4{font-size:15px;margin:0;font-weight:600;color:var(--white);}
      .role-meta{color:var(--muted);font-size:11px;letter-spacing:.02em;}
      .role-intro{margin:8px 0 8px;color:#cbc8c0;font-size:14px;}
      ul{margin:8px 0 0;padding-left:0;list-style:none;}
      li{position:relative;padding-left:20px;margin:8px 0;font-size:14px;color:#d7d4cc;}
      li::before{content:"▸";position:absolute;left:2px;color:var(--green-dim);font-size:11px;top:2px;}
      strong{color:var(--white);font-weight:600;}
      .job-note{margin-top:16px;font-style:italic;color:var(--muted);font-size:13px;}
      .earlier-head{font-size:16px;margin:22px 0 0;font-weight:700;}
      .earlier li,.earlier-note{font-size:13.5px;}
      .earlier-note{color:var(--muted);font-style:italic;margin-top:10px;padding-left:20px;}
      .skills p{margin:10px 0;font-size:14px;color:#d7d4cc;}
      .skill-group{color:var(--green);font-weight:600;}
      .education p{margin:6px 0;font-size:14px;color:#d7d4cc;}

      footer{position:relative;z-index:2;text-align:center;color:var(--muted);font-size:11.5px;
        padding:28px;border-top:1px solid rgba(141,198,63,0.12);}
      footer a{color:var(--muted);text-decoration:none;}
      footer a:hover{color:var(--green);}
      .err{color:#e88;font-size:14px;padding:20px;border:1px solid rgba(255,120,120,.3);border-radius:8px;}
      @media (max-width:640px){header.name h1{font-size:30px;}.sheet{padding:36px 20px 70px;}}
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="mark">
        <svg viewBox="0 0 43.86 49.94" fill="#8dc63f" aria-label="N8+US logo">
          <path d="M12.15.02c-.55,0-.99.44-.98.99l.04,18.61L1.91.53C1.7.13,1.24-.08.8.03.36.14.05.53.05.99l.02,22.45c0,.55.44.99.99.99.55,0,.99-.44.99-.99h0V4.98s9.29,19.11,9.29,19.11c.17.33.52.53.87.53.08,0,.16,0,.24-.03.44-.11.75-.51.75-.96l-.05-22.62c0-.54-.44-.99-.99-.98Z"/>

          <path d="M22.17,37.18c-.13-.06-.27-.09-.41-.09h0c-2.44,0-4.41-1.98-4.41-4.41,0-2.44,1.98-4.41,4.41-4.41,2.44,0,4.41,1.98,4.41,4.41,0,.55.44.99.99.99s.99-.44.99-.99c0-3.53-2.86-6.39-6.39-6.39s-6.39,2.86-6.39,6.39c0,3.45,2.74,6.25,6.16,6.37.13.06.27.09.41.09,2.44,0,4.41,1.98,4.41,4.41,0,2.44-1.98,4.41-4.41,4.41-2.44,0-4.41-1.98-4.41-4.41,0-.55-.44-.99-.99-.99s-.99.44-.99.99c0,3.53,2.86,6.38,6.39,6.39,3.53,0,6.39-2.86,6.39-6.39,0-3.45-2.74-6.25-6.16-6.38Z"/>

        </svg>
        <span class="idline mono"><b>N8+US, Inc.</b> — Résumé</span>
      </div>
      <nav class="topnav">
        <a href="/">Home</a>
        <a href="./resume.html">Print view</a>
        <a href="./resume-edit.html">Edit</a>
        <a href="/assets/resume-slim-v4-gold.pdf">PDF</a>
      </nav>
    </div>

    <main class="sheet">
      <div class="prompt mono"><span>n8plusus:~$</span><span>cat resume.json</span><span class="blink"></span></div>
      <div id="root"><p class="mono" style="color:var(--muted)">Loading résumé…</p></div>
    </main>

    <footer class="mono">
      <a href="/">n8plusus.com</a> · rendered from <a href="./resume.json">resume.json</a>
    </footer>

    <script type="module">
      import { loadResume, renderBody, contactLinks, esc } from './resume-render.js';
      const root = document.getElementById('root');
      try {
        const d = await loadResume();
        document.title = `${d.name} — Résumé · N8+US`;
        const links = contactLinks(d.contact)
          .map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('<span class="loc">·</span> ');
        root.innerHTML = `
          <header class="name">
            <h1>${esc(d.name)}</h1>
            <div class="title">${esc(d.title)}</div>
            <div class="contact"><span class="loc">${esc(d.location)}</span>${links ? '<span class="loc">·</span> ' + links : ''}</div>
          </header>
          <div class="toolbar">
            <a class="btn" href="./resume.html">Print / Save PDF</a>
            <a class="btn btn-ghost" href="./resume-edit.html">Edit résumé</a>
          </div>
          ${renderBody(d)}`;
      } catch (e) {
        root.innerHTML = `<div class="err mono">Couldn't load resume.json — is the site being served (not opened as a file)?<br>${esc(e.message)}</div>`;
      }
    </script>
  </body>
</html>
