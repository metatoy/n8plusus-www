<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nathan H O'Brien — Résumé</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Print/ATS view styled to match the RiseSmart Foundation resume
         (Nathan H O'Brien_Resume_Final.pdf): plain sans-serif, right-aligned
         contact, Skills before Experience, justified body, filled bullets,
         grey underlined section labels, right-aligned dates. 2026-09-02. */
      :root{ --ink:#222; --muted:#666; --rule:#b7b7b7; --accent:#5f8a2a; }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;background:#f2f2f0;}
      body{font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;color:var(--ink);
        font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}
      .mono{font-family:inherit;}

      .bar{max-width:816px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
      .bar .actions{display:flex;gap:10px;}
      .btn{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.02em;padding:9px 14px;border-radius:5px;
        text-decoration:none;cursor:pointer;border:1px solid var(--ink);color:var(--ink);background:transparent;transition:background .15s,color .15s;}
      .btn.primary{background:var(--ink);color:#fff;}
      .btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

      .page{max-width:816px;margin:0 auto 40px;background:#fff;padding:46px 54px;
        box-shadow:0 18px 50px -22px rgba(0,0,0,.4);}

      /* header: name left, contact stacked top-right */
      header.name{margin-bottom:12px;}
      .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
      header.name h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;}
      .contact{text-align:right;font-size:11.5px;color:var(--muted);line-height:1.6;}
      .contact a{color:var(--ink);text-decoration:none;}
      .contact a:hover{text-decoration:underline;}
      .title{font-weight:700;font-size:15.5px;margin:16px 0 0;}

      .summary{font-size:13.5px;margin:9px 0 0;text-align:justify;}

      .section-label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
        margin:18px 0 9px;padding-bottom:4px;border-bottom:1px solid var(--rule);}

      .job-head,.role-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;}
      .job-head h3{font-size:16px;margin:11px 0 0;font-weight:700;}
      .job-meta{color:var(--muted);font-size:12.5px;font-weight:400;}
      .role{margin-top:8px;}
      .role-head h4{font-size:14px;margin:0;font-weight:700;}
      .role-meta{color:var(--muted);font-size:12.5px;}
      .role-intro{margin:5px 0;font-size:13.5px;text-align:justify;}
      ul{margin:5px 0 0;padding-left:18px;list-style:disc;}
      li{margin:4px 0;font-size:13.5px;text-align:justify;}
      li::marker{color:var(--ink);}
      strong{font-weight:700;}
      .job-note{margin-top:9px;font-style:italic;color:#555;font-size:13px;}
      .earlier-head{font-size:14px;margin:13px 0 0;font-weight:700;}
      .earlier li,.earlier-note{font-size:13.5px;}
      .earlier-note{color:var(--muted);font-style:italic;margin-top:7px;padding-left:18px;}
      .skills p{margin:6px 0;font-size:13.5px;text-align:justify;}
      .skill-group{font-weight:700;}
      .education p{margin:4px 0;font-size:13.5px;}
      .role{break-inside:avoid;}
      .section-label,.job-head,.role-head,.earlier-head{break-after:avoid;}

      .err{color:#a33;font-size:13px;}
      @media print{
        @page{margin:0.5in;}
        html,body{background:#fff;}
        .bar{display:none;}
        .page{box-shadow:none;margin:0;padding:0;max-width:none;}
      }
      @media (max-width:640px){.page{padding:30px 20px;}header.name h1{font-size:20px;}
        .head-row{flex-direction:column;}.contact{text-align:left;}}
    </style>
      <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FJ2Q9HVPTZ"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FJ2Q9HVPTZ');</script>
  </head>
  <body>
    <div class="bar">
      <a class="btn" href="./index.html">← Display view</a>
      <div class="actions">
        <a class="btn" href="./resume-edit.html">Edit</a>
        <button class="btn primary" onclick="window.print()">Print / Save PDF</button>
      </div>
    </div>
    <div class="page"><div id="root"><p class="mono">Loading…</p></div></div>

    <script type="module">
      import { loadResume, renderBody, esc } from './resume-render.js';
      const root = document.getElementById('root');
      const A = (label, href) => href ? `<a href="${esc(href)}">${esc(label)}</a>` : esc(label);
      try {
        const d = await loadResume();
        document.title = `${d.name} — Résumé`;
        const c = d.contact || {};
        const line1 = [
          c.email ? A(c.email, `mailto:${c.email}`) : '',
          c.phone ? A(c.phone, `tel:${c.phone.replace(/[^+\d]/g, '')}`) : ''
        ].filter(Boolean).join(' &bull; ');
        const line2 = [
          esc(d.location),
          c.linkedin ? A(c.linkedin, `https://${c.linkedin.replace(/^https?:\/\//, '')}`) : '',
          c.github ? A(c.github, `https://${c.github.replace(/^https?:\/\//, '')}`) : ''
        ].filter(Boolean).join(' &bull; ');
        root.innerHTML = `
          <header class="name">
            <div class="head-row">
              <h1>${esc(d.name)}</h1>
              <div class="contact"><div>${line1}</div><div>${line2}</div></div>
            </div>
            <div class="title">${esc(d.title)}</div>
          </header>
          ${renderBody(d)}`;
      } catch (e) {
        root.innerHTML = `<div class="err mono">Couldn't load resume.json — serve the site (don't open as a file://). ${esc(e.message)}</div>`;
      }
    </script>
  </body>
</html>
