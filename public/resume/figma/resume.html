<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nathan H O'Brien — Résumé</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{ --ink:#231f20; --green-dim:#5f8a2a; --muted:#6f6a5f; --rule:#dcd7c9; }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;background:#efece4;}
      body{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}

      .bar{max-width:816px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
      .bar .actions{display:flex;gap:10px;}
      .btn{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.02em;padding:9px 14px;border-radius:5px;
        text-decoration:none;cursor:pointer;border:1px solid var(--ink);color:var(--ink);background:transparent;transition:background .15s,color .15s;}
      .btn.primary{background:var(--ink);color:#efece4;}
      .btn:hover{background:var(--green-dim);border-color:var(--green-dim);color:#fff;}

      .page{max-width:816px;margin:0 auto 40px;background:#fff;padding:56px 64px;
        box-shadow:0 18px 50px -22px rgba(0,0,0,.4);border-radius:2px;}

      header.name{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:6px;}
      header.name h1{font-size:34px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-0.01em;}
      header.name .title{font-weight:600;font-size:14px;margin-top:6px;}
      header.name .contact{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;}
      header.name .contact a{color:var(--ink);text-decoration:none;}
      header.name .contact a:hover{text-decoration:underline;}

      .section-label{color:var(--green-dim);font-size:10px;letter-spacing:.16em;margin:26px 0 10px;
        padding-bottom:6px;border-bottom:1px solid var(--rule);}
      .summary{font-size:13.5px;margin:16px 0 0;}

      .job-head,.role-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;}
      .job-head h3{font-size:17px;margin:16px 0 0;font-weight:700;}
      .job-meta{color:var(--muted);font-size:10.5px;}
      .role{margin-top:12px;}
      .role-head h4{font-size:13.5px;margin:0;font-weight:600;}
      .role-meta{color:var(--muted);font-size:10.5px;}
      .role-intro{margin:6px 0;font-size:12.5px;}
      ul{margin:6px 0 0;padding-left:0;list-style:none;}
      li{position:relative;padding-left:16px;margin:5px 0;font-size:12.5px;}
      li::before{content:"▸";position:absolute;left:0;color:var(--green-dim);font-size:10px;top:1px;}
      strong{font-weight:700;}
      .job-note{margin-top:12px;font-style:italic;color:#555;font-size:12px;}
      .earlier-head{font-size:14px;margin:18px 0 0;font-weight:700;}
      .earlier li,.earlier-note{font-size:12px;}
      .earlier-note{color:var(--muted);font-style:italic;margin-top:8px;padding-left:16px;}
      .skills p{margin:8px 0;font-size:12.5px;}
      .skill-group{font-weight:700;}
      .education p{margin:4px 0;font-size:12.5px;}
      .role,.job{break-inside:avoid;}

      .err{color:#a33;font-size:13px;}
      @media print{
        @page{margin:0.5in;}
        html,body{background:#fff;}
        .bar{display:none;}
        .page{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0;}
      }
      @media (max-width:640px){.page{padding:32px 22px;}header.name h1{font-size:26px;}}
    </style>
      <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FJ2Q9HVPTZ"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FJ2Q9HVPTZ');</script>
  </head>
  <body>
    <div class="bar">
      <a class="btn" href="./index.html">← Display view</a>
      <div class="actions">
        <a class="btn" href="./resume-edit.html">Edit</a>
        <button class="btn primary" onclick="window.print()">Print / Save PDF</button>
      </div>
    </div>
    <div class="page"><div id="root"><p class="mono">Loading…</p></div></div>

    <script type="module">
      import { loadResume, renderBody, contactLinks, esc } from './resume-render.js';
      const root = document.getElementById('root');
      try {
        const d = await loadResume();
        document.title = `${d.name} — Résumé`;
        const links = contactLinks(d.contact).map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join(' · ');
        root.innerHTML = `
          <header class="name">
            <h1>${esc(d.name)}</h1>
            <div class="title">${esc(d.title)}</div>
            <div class="contact">${esc(d.location)} · ${links}</div>
          </header>
          ${renderBody(d)}`;
      } catch (e) {
        root.innerHTML = `<div class="err mono">Couldn't load resume.json — serve the site (don't open as a file://). ${esc(e.message)}</div>`;
      }
    </script>
  </body>
</html>
