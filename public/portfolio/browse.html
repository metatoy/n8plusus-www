<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio — Nathan O'Brien</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#231f20; --paper:#f1efe8; --card:#ffffff;
    --text:#2a2622; --muted:#6f6b62; --line:#e2ddcf;
    --green:#8dc63f; --green-ink:#5a8a24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  a{color:inherit;text-decoration:none}
  .pico{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px;margin-right:6px}
  .ico{width:16px;height:16px;vertical-align:-3px;margin-right:6px}

  /* dark header band */
  .masthead{background:var(--ink);color:#f4f2ec}
  .masthead .inner{max-width:1080px;margin:0 auto;padding:22px 22px 30px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .brand{display:inline-flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .wordmark{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--green);font-size:15px;letter-spacing:.02em}
  .ident{font-size:13.5px;color:#b6b2a8;line-height:1.4}
  .ident b{color:#f4f2ec;font-weight:600}
  .hlinks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hlink{font-size:12.5px;color:#d7d3c8;border:1px solid #48423f;border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;transition:all .15s}
  .hlink:hover{border-color:var(--green);color:var(--green)}
  .hlink.solid{background:var(--green);border-color:var(--green);color:var(--ink);font-weight:600}
  .hlink.solid:hover{background:#a0d64f;color:var(--ink)}
  .masthead h1{font-size:32px;margin:0 0 6px;letter-spacing:-.01em}
  .masthead .sub{color:#c3bfb4;font-size:14px;margin:0;max-width:62ch}

  /* light body */
  .body{max-width:1080px;margin:0 auto;padding:28px 22px 80px}

  .filters{margin:0 0 30px}
  .fbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .fgroup.roles{margin-top:2px}
  .flabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;margin-right:2px}
  .pill{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer;transition:all .15s;letter-spacing:.02em;display:inline-flex;align-items:center}
  .pill:hover{border-color:var(--green-ink);color:var(--green-ink)}
  .pill.active{background:var(--green);border-color:var(--green);color:var(--ink);font-weight:700}
  .pill.clear{color:var(--muted);border-style:dashed}
  .pill:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px}
  .fcount{color:var(--green-ink);font-size:11px;margin:12px 0 0;letter-spacing:.04em;font-weight:600}
  .empty{color:var(--muted);font-size:14px;padding:20px 0}
  .linklike{background:none;border:none;color:var(--green-ink);cursor:pointer;font:inherit;text-decoration:underline;padding:0}

  .era{margin:0 0 40px}
  .era.other{margin-top:36px}
  .era.other .grid{opacity:.7}
  #pf-grid > .grid:first-child{margin-bottom:8px}
  .era-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 18px;font-size:15px;letter-spacing:.02em;color:var(--ink)}
  .era-h .range{color:var(--muted);font-size:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block;transition:border-color .18s,transform .18s,box-shadow .18s;box-shadow:0 1px 2px rgba(35,31,32,.04)}
  .card:hover{border-color:var(--green-ink);transform:translateY(-2px);box-shadow:0 6px 18px rgba(35,31,32,.08)}
  .card-thumb{aspect-ratio:16/9;background:#f4f2ea;border-bottom:1px solid var(--line);overflow:hidden}
  .card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
  .card:hover .card-thumb img{transform:scale(1.03)}
  .card-thumb--none{display:flex;align-items:center;justify-content:center;background:var(--ink)}
  .card-thumb--none span{color:var(--green);font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  .card-body{padding:14px 18px 16px}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .card .yr{font-family:"JetBrains Mono",monospace;color:var(--green-ink);font-size:11.5px;letter-spacing:.04em;font-weight:500}
  .soon{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px;text-transform:uppercase;letter-spacing:.05em}
  .card h3{margin:0 0 4px;font-size:17px;line-height:1.25;color:var(--ink)}
  .card .client{color:var(--muted);font-size:12px;margin:0 0 8px;font-family:"JetBrains Mono",monospace}
  .card .sum{font-size:13.5px;line-height:1.5;color:#4a453f;margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:#faf8f2}
  .chip.more{color:var(--green-ink);border-color:#dce8c8;background:#f2f7e8}

  footer{color:var(--muted);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
  footer a{color:var(--green-ink)}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
  <header class="masthead">
    <div class="inner">
      <div class="top">
        <span class="brand"><span class="wordmark">N8+US:</span> <span class="ident"><b>Nathan Hunsaker O'Brien:</b> Creative Engineering Leader · AI-Native / Agentic Systems</span></span>
        <span class="hlinks">
          <a class="hlink" href="https://linkedin.com/in/nathanhunsaker" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="/portfolio/icons.svg#linkedin-logo"></use></svg>LinkedIn</a>
          <a class="hlink solid" href="/resume/resume.pdf" download><svg class="ico" aria-hidden="true"><use href="/portfolio/icons.svg#file-arrow-down"></use></svg>Résumé (PDF)</a>
        </span>
      </div>
      <h1>Selected work</h1>
      <p class="sub">Thirty years at the seam where design meets engineering: the web, rich apps, social platforms, and agentic AI. Grouped by era; filter by skill or role.</p>
    </div>
  </header>
  <main class="body">
    <div id="portfolio"></div>
    <footer><a href="https://n8plusus.com">n8plusus.com</a></footer>
  </main>
  <script src="/portfolio/portfolio-render.js"></script>
  <script>renderIndex("portfolio");</script>
</body>
</html>
