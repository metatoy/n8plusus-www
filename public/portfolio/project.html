<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project — Nathan O'Brien</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#231f20; --paper:#f1efe8; --card:#ffffff;
    --text:#2a2622; --muted:#6f6b62; --line:#e2ddcf;
    --green:#8dc63f; --green-ink:#5a8a24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  a{color:inherit}

  /* dark top bar */
  .bar{background:var(--ink);color:#f4f2ec}
  .bar .inner{max-width:820px;margin:0 auto;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
  .bar .barback{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#b6b2a8;text-decoration:none}
  .bar .barback:hover{color:var(--green)}
  .bar .hlinks{display:flex;align-items:center;gap:8px}
  .bar .ico{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
  .bar .hlink{font-size:12.5px;color:#d7d3c8;border:1px solid #48423f;border-radius:8px;padding:5px 11px;display:inline-flex;align-items:center;text-decoration:none;transition:all .15s}
  .bar .hlink:hover{border-color:var(--green);color:var(--green)}
  .bar .hlink.solid{background:var(--green);border-color:var(--green);color:var(--ink);font-weight:600}
  .bar .hlink.solid:hover{background:#a0d64f}

  .wrap{max-width:820px;margin:0 auto;padding:34px 22px 80px}
  .back{display:none} /* renderer's inline back link hidden; bar has it */
  .phead .meta-line{font-family:"JetBrains Mono",monospace;color:var(--green-ink);font-size:12.5px;letter-spacing:.03em;margin:0 0 8px}
  .phead h1{font-size:32px;line-height:1.1;letter-spacing:-.01em;margin:0 0 14px;color:var(--ink)}
  .lede{font-size:17px;line-height:1.55;color:#3f3a34;margin:0 0 18px;max-width:64ch}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:#faf8f2}
  .links{display:flex;gap:16px;margin-bottom:8px}
  .ext{color:var(--green-ink);font-size:13px;text-decoration:none;font-weight:600}
  .ext:hover{text-decoration:underline}
  .subsec{border-top:1px solid var(--line);margin-top:28px;padding-top:20px}
  .subsec h3{font-size:19px;margin:0 0 8px;color:var(--ink)}
  .body,.subsec{font-size:15px;line-height:1.65;color:#3f3a34}
  .body p,.subsec p{margin:0 0 14px}
  .gallery{margin-top:34px;display:grid;gap:26px}
  .media{margin:0}
  .media img,.media video{width:100%;border:1px solid var(--line);border-radius:10px;display:block;background:#fff;box-shadow:0 2px 8px rgba(35,31,32,.06)}
  .media.embed iframe{width:100%;min-height:520px;border:1px solid var(--line);border-radius:10px;display:block;background:#fff;box-shadow:0 2px 8px rgba(35,31,32,.06)}
  .media figcaption{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.5}
  .media figcaption b{color:var(--ink);font-weight:600}
  .skills-sec{margin-top:34px}
  .skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 28px;margin-top:4px}
  .skgroup h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--green-ink);margin:0 0 8px;font-weight:600}
  .skgroup ul{list-style:none;margin:0;padding:0}
  .skgroup li{font-size:13.5px;line-height:1.55;color:#3f3a34;padding:2px 0 2px 14px;position:relative}
  .skgroup li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--green)}
  .soon-note{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:16px 18px;margin-top:30px;background:#faf8f2}
  footer{color:var(--muted);font-size:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:16px}
  footer a{text-decoration:none;color:var(--green-ink)} footer a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="bar"><div class="inner">
    <a class="barback" href="/portfolio/browse.html">← all work</a>
    <span class="hlinks">
      <a class="hlink" href="https://linkedin.com/in/nathanhunsaker" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="/portfolio/icons.svg#linkedin-logo"></use></svg>LinkedIn</a>
      <a class="hlink solid" href="/resume/resume.pdf" download><svg class="ico" aria-hidden="true"><use href="/portfolio/icons.svg#file-arrow-down"></use></svg>Résumé (PDF)</a>
    </span>
  </div></div>
  <div class="wrap">
    <div id="project"></div>
    <footer>
      <a href="/portfolio/browse.html">all work</a> · <a href="https://n8plusus.com">n8plusus.com</a>
    </footer>
  </div>
  <script src="/portfolio/portfolio-render.js"></script>
  <script>renderProject("project");</script>
</body>
</html>
