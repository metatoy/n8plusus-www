<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Project — Nathan O'Brien</title>
<meta name="robots" content="noindex" />
<style>body{font-family:system-ui,sans-serif;background:#f1efe8;color:#5a8a24;padding:40px}</style>
<script>
  // legacy URL: /portfolio/project.html?slug=<slug> → /portfolio/<slug>.html
  (function () {
    var s = new URLSearchParams(location.search).get("slug");
    location.replace(s ? "/portfolio/" + encodeURIComponent(s) + ".html" : "/portfolio/");
  })();
</script>
</head><body>Redirecting to the <a href="/portfolio/">portfolio</a>…</body></html>
