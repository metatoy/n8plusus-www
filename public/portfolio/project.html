<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project — Nathan O'Brien</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#231f20; --green:#8dc63f; --white:#f4f2ec; --muted:#9d9a92; --card:#2a2627; --line:#3a3536; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--white);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .wrap{max-width:820px;margin:0 auto;padding:36px 22px 80px}
  a{color:inherit}
  .back{display:inline-block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;margin-bottom:26px}
  .back:hover{color:var(--green)}
  .phead .meta-line{color:var(--green);font-size:12.5px;letter-spacing:.04em;margin:0 0 8px}
  .phead h1{font-size:32px;line-height:1.1;letter-spacing:-.01em;margin:0 0 14px}
  .lede{font-size:17px;line-height:1.55;color:#e4e0d6;margin:0 0 18px;max-width:64ch}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
  .links{display:flex;gap:16px;margin-bottom:8px}
  .ext{color:var(--green);font-size:13px;text-decoration:none}
  .ext:hover{text-decoration:underline}
  .subsec{border-top:1px solid var(--line);margin-top:28px;padding-top:20px}
  .subsec h3{font-size:19px;margin:0 0 8px}
  .body,.subsec{font-size:15px;line-height:1.65;color:#d8d4ca}
  .body p,.subsec p{margin:0 0 14px}
  .gallery{margin-top:34px;display:grid;gap:26px}
  .media{margin:0}
  .media img,.media video{width:100%;border:1px solid var(--line);border-radius:10px;display:block;background:#000}
  .media figcaption{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.5}
  .media figcaption b{color:var(--white);font-weight:600}
  .soon-note{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:16px 18px;margin-top:30px}
  footer{color:var(--muted);font-size:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:16px}
  footer a{text-decoration:none} footer a:hover{color:var(--green)}
</style>
</head>
<body>
  <div class="wrap">
    <div id="project"></div>
    <footer>
      <a href="/portfolio/browse.html">all work</a> · <a href="/resume">résumé</a> · <a href="https://linkedin.com/in/nathanhunsaker" target="_blank" rel="noopener">LinkedIn</a> · hello@metatoy.com
    </footer>
  </div>
  <script src="/portfolio/portfolio-render.js"></script>
  <script>renderProject("project");</script>
</body>
</html>
