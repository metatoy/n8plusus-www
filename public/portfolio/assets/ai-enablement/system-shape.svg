<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">AI enablement for a design system: the general shape</title>
  <desc id="d">Figma is the source of truth for design. An agent skill drafts a contract per component from Figma; people approve it. From the contract, a second skill generates the Angular component with tests and Storybook stories, and Code Connect files that link the code back to the Figma component; Chromatic snapshots one story per Figma variant cell. An MCP server that follows the rules set in the contracts gives coding agents in the apps that use the design system deeper knowledge of its components. Scout scans those apps for adoption and component usage, which feeds people: a feedback loop that keeps improving the workflow, approves only changes that add value to the system, and has the final say on correctness. An agent harness enforces the rules, and evals in promptfoo measure every step.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#231f20"/>
    </marker>
    <style>
      .sans{font-family:"Space Grotesk",Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",Menlo,Consolas,monospace}
      .h{font-size:21px;font-weight:700}
      .s{font-size:12.5px}
      .lab{font-size:12px;letter-spacing:.04em}
      .k{font-size:11px;letter-spacing:.14em}
    </style>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#f1efe8"/>
  <text x="40" y="48" class="mono k" fill="#5a8a24">THE GENERAL SHAPE · AGENTS DRAFT AND GENERATE, PEOPLE APPROVE</text>

  <!-- ===== row 1: Figma → Contract → Angular → Chromatic ===== -->
  <g class="sans">
    <rect x="40" y="110" width="200" height="104" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="60" y="148" class="h" fill="#231f20">Figma</text>
    <text x="60" y="174" class="s" fill="#4a4540">source of truth for design</text>
    <text x="60" y="193" class="s" fill="#4a4540">every variant combination</text>

    <rect x="340" y="110" width="200" height="104" rx="10" fill="#231f20"/>
    <text x="360" y="148" class="h" fill="#f4f2ec">Contract</text>
    <text x="360" y="174" class="s" fill="#c9c6be">one per component</text>
    <text x="360" y="193" class="s" fill="#c9c6be">rules, validated by schema</text>

    <rect x="640" y="110" width="200" height="104" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="660" y="148" class="h" fill="#231f20">Angular</text>
    <text x="660" y="174" class="s" fill="#4a4540">component + unit tests</text>
    <text x="660" y="193" class="s" fill="#4a4540">+ Storybook stories</text>

    <rect x="940" y="110" width="220" height="104" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="960" y="148" class="h" fill="#231f20">Chromatic</text>
    <text x="960" y="174" class="s" fill="#4a4540">one snapshot per Figma cell</text>
    <text x="960" y="193" class="s" fill="#4a4540">visual diff on every change</text>
  </g>

  <line x1="244" y1="162" x2="334" y2="162" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="289" y="96" class="mono lab" fill="#5a8a24" text-anchor="middle">AGENT</text>
  <text x="289" y="148" class="sans s" fill="#231f20" text-anchor="middle">drafts</text>

  <line x1="544" y1="162" x2="634" y2="162" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="589" cy="162" r="13" fill="#8dc63f" stroke="#231f20" stroke-width="1.5"/>
  <path d="M583 162l4 4 8-9" fill="none" stroke="#231f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="589" y="96" class="mono lab" fill="#5a8a24" text-anchor="middle">PEOPLE → AGENT</text>
  <text x="589" y="198" class="sans s" fill="#231f20" text-anchor="middle">approve,</text>
  <text x="589" y="214" class="sans s" fill="#231f20" text-anchor="middle">then generate</text>

  <line x1="844" y1="162" x2="934" y2="162" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="889" y="148" class="sans s" fill="#231f20" text-anchor="middle">matrix</text>
  <text x="889" y="198" class="sans s" fill="#231f20" text-anchor="middle">stories</text>

  <!-- validators -->
  <path d="M200 214V246H740V214" fill="none" stroke="#5a8a24" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M1050 214V246H760" fill="none" stroke="#5a8a24" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="600" y="268" class="mono lab" fill="#5a8a24" text-anchor="middle">VALIDATORS</text>

  <!-- ===== row 2: Code Connect · MCP server · Coding agents · Scout ===== -->
  <g class="sans">
    <rect x="40" y="320" width="200" height="104" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="60" y="358" class="h" fill="#231f20">Code Connect</text>
    <text x="60" y="384" class="s" fill="#4a4540">links each component's</text>
    <text x="60" y="403" class="s" fill="#4a4540">code back to Figma</text>

    <rect x="340" y="320" width="200" height="104" rx="10" fill="#8dc63f"/>
    <text x="360" y="358" class="h" fill="#231f20">MCP server</text>
    <text x="360" y="384" class="s" fill="#231f20">follows the contracts’ rules</text>
    <text x="360" y="403" class="s" fill="#231f20">deep component knowledge</text>

    <rect x="640" y="320" width="200" height="104" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="660" y="358" class="h" fill="#231f20">Coding agents</text>
    <text x="660" y="384" class="s" fill="#4a4540">in the apps that use</text>
    <text x="660" y="403" class="s" fill="#4a4540">the design system</text>

    <rect x="940" y="320" width="220" height="104" rx="10" fill="#18191c"/>
    <text x="960" y="358" class="h" fill="#f2f3f7">Scout</text>
    <text x="960" y="384" class="s" fill="#c9c6be">adoption + component usage</text>
    <text x="960" y="403" class="s" fill="#c9c6be">across every repo</text>
  </g>

  <!-- contract → code connect -->
  <path d="M380 214V290H140V314" fill="none" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="260" y="284" class="sans s" fill="#231f20" text-anchor="middle">generates</text>
  <!-- code connect → Figma -->
  <path d="M70 320V218" fill="none" stroke="#231f20" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#a)"/>

  <!-- contract → MCP -->
  <path d="M460 214V314" fill="none" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="472" y="304" class="sans s" fill="#231f20">served as data</text>

  <!-- MCP → agents -->
  <line x1="544" y1="372" x2="634" y2="372" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="589" y="360" class="sans s" fill="#231f20" text-anchor="middle">answers</text>

  <!-- component ships to apps -->
  <path d="M740 214V314" fill="none" stroke="#231f20" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <text x="752" y="304" class="sans s" fill="#231f20">ships to</text>

  <!-- apps → Scout -->
  <line x1="844" y1="372" x2="934" y2="372" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="889" y="360" class="sans s" fill="#231f20" text-anchor="middle">scans</text>

  <!-- ===== row 3: harness · people ===== -->
  <g class="sans">
    <rect x="40" y="470" width="560" height="110" rx="10" fill="none" stroke="#231f20" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="60" y="498" class="mono k" fill="#5a8a24">HARNESS · KIRO</text>
    <text x="60" y="524" class="s" fill="#231f20">specs order the work · steering and skills guide it</text>
    <text x="60" y="544" class="s" fill="#231f20">hooks enforce the rules</text>
    <text x="60" y="566" class="s" fill="#231f20" font-weight="700">agents never approve</text>

    <rect x="640" y="470" width="520" height="110" rx="10" fill="none" stroke="#231f20" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="660" y="498" class="mono k" fill="#5a8a24">PEOPLE</text>
    <text x="660" y="524" class="s" fill="#231f20">a feedback loop that keeps improving the workflow</text>
    <text x="660" y="544" class="s" fill="#231f20">approve only changes that add value to the system</text>
    <text x="660" y="566" class="s" fill="#231f20" font-weight="700">final say on correctness</text>
  </g>
  <!-- Scout → people -->
  <path d="M1050 424V464" fill="none" stroke="#231f20" stroke-width="2" marker-end="url(#a)"/>
  <text x="1062" y="450" class="sans s" fill="#231f20">usage data</text>

  <!-- evals band -->
  <rect x="40" y="610" width="1120" height="80" rx="10" fill="#231f20"/>
  <text x="64" y="640" class="mono k" fill="#8dc63f">EVALS: PROMPTFOO</text>
  <g class="sans s" fill="#f4f2ec">
    <text x="64" y="670">1  Tool accuracy: the MCP tools, no model</text>
    <text x="440" y="670">2  Agent + MCP: real questions, known failures</text>
    <text x="820" y="670">3  Generation: scored against an answer key</text>
  </g>
</svg>
