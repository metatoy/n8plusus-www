<body>
  <div id="wt"></div>
  <script src="/portfolio/walkthroughs/sorb/scenes.js"></script>
  <script src="/portfolio/walkthroughs/walkthrough.js"></script>
  <script>
    Walkthrough({
      mount: "#wt",
      title: "Walkthrough: a design token's trip from Figma to a running React app",
      id: "sorb",
      scenes: window.WT_SORB_SCENES,
      manifest: [
        { id: "subject", title: "What's the source of truth: your Figma file, or the live running app?", scene: "subject", audio: "/portfolio/walkthroughs/sorb/step-01.mp3", durationMs: 22700,
          body: "The problem I set out to solve: tokens get defined in Figma or imported from existing code in a one-way process that's hard to maintain and impossible to preview. So I didn't anchor on the design file. I anchored on the running app." },
        { id: "architecture", title: "I built it as a tree, one code repo for each part.", scene: "architecture", audio: "/portfolio/walkthroughs/sorb/step-02.mp3", durationMs: 27951,
          body: "The foundation of Sorb is four pieces sharing one contract so they can't drift apart: a Figma plugin named Canopy, a bridge server called Juice, a React SDK called Leaf, and a capture-and-resolve layer called Seed. The core packages are open source on npm; the Figma plugin and our hosted platform, Sorb Cloud, are the commercial layer." },
        { id: "front-door", title: "Getting connected is a click, not a config file.", poster: "/portfolio/walkthroughs/sorb/screens/front-door.png", audio: "/portfolio/walkthroughs/sorb/step-03.mp3", durationMs: 34403,
          body: "Connecting used to mean copying keys around. Now the plugin opens your browser, you sign in once, and a device pairing hands it a scoped key automatically. Nothing to paste, nothing to leak. Sorb is technically complex under the hood but built for non-technical users: if you can use Figma, you can use this. Browser sign-in, a zero-install tour of the whole flow, and end-to-end workflows that add code bindings without needing a developer." },
        { id: "preview", title: "Edit a token in Figma or in the plugin: the app re-themes in place.", poster: "/portfolio/walkthroughs/sorb/screens/preview-live.png", audio: "/portfolio/walkthroughs/sorb/step-04.mp3", durationMs: 32209, money: "after",
          body: "This is the whole point. The React SDK applies the proposed tokens as CSS custom properties, and the real components re-skin in place, before anyone merges. Every token keeps a committed fallback, so if the preview layer disappears, the app quietly ships what's committed. An experiment can never break production. And when you like what you see, one click snapshots it into the project." },
        { id: "multi-stack", title: "One token set, six different stacks.", poster: "/portfolio/walkthroughs/sorb/screens/multi-stack.png", audio: "/portfolio/walkthroughs/sorb/step-05.mp3", durationMs: 17502,
          body: "Originally built for React, the Sorb ecosystem supports Bootstrap, Tailwind, MUI, Mantine, PrimeVue, and Angular Material, all re-themed from the same token set, once it's defined in Sorb." },
        { id: "connectivity", title: "When a preview fails, Sorb names the side that broke.", scene: "diagnosis", audio: "/portfolio/walkthroughs/sorb/step-06.mp3", durationMs: 25078,
          body: "Anything distributed can fail somewhere eventually, so I built the diagnosis in. The SDK answers a ping with a fingerprint (which project, which key, which bridge), and a diagnosis panel names which side owns a failure: the plugin, the bridge, the app, or the cloud. Debugging is made easier this way." },
        { id: "ship", title: "A token version becomes a pull request.", poster: "/portfolio/walkthroughs/sorb/screens/ship.png", audio: "/portfolio/walkthroughs/sorb/step-07-ship.mp3", durationMs: 17737,
          body: "Token changes end their trip as code, so shipping is easy. The Token Explorer compares versions side by side, previews any version in the running app, and turns an approved one into a GitHub pull request with one click." },
        { id: "agents", title: "I exposed the whole thing to agents over MCP.", scene: "agents", audio: "/portfolio/walkthroughs/sorb/step-07.mp3", durationMs: 28787,
          body: "I wrapped the bridge in MCP servers, behind a secure authentication layer, so an agent can drive it. And I made the running app the oracle: for the first write feature, a contrast fixer, the judge is the deterministic WCAG math, not the model. The AI proposes; a human reviews; the live app verifies. No auto-apply anywhere." },
        { id: "try-it", title: "Give it a try, right now.", poster: "/portfolio/walkthroughs/sorb/screens/try-tour.png", audio: "/portfolio/walkthroughs/sorb/step-09.mp3", durationMs: 21629,
          body: "Everything you just watched is clickable at try.sorbcloud.com: the real plugin and a real storefront, with the bridge played by a service worker. Nothing to install, no account to make. And the four @sorb packages are live on npm when you're ready to wire up your own app." },
      ],
    });
  </script>
