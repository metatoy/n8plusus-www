<title>Sorb — walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/portfolio/walkthroughs/walkthrough.css" />
</head>
<body>
  <div id="wt"></div>
  <script src="/portfolio/walkthroughs/sorb/scenes.js"></script>
  <script src="/portfolio/walkthroughs/walkthrough.js"></script>
  <script>
    Walkthrough({
      mount: "#wt",
      title: "Walkthrough: a design token's trip from Figma to a running React app",
      id: "sorb",
      scenes: window.WT_SORB_SCENES,
      manifest: [
        { id: "subject", title: "A token approved in Figma, re-typed by hand in code.", scene: "subject", audio: "/portfolio/walkthroughs/sorb/step-01.mp3", durationMs: 16013,
          body: "The problem I set out to kill: a token gets approved in Figma, then re-typed by hand in code, and it quietly drifts — nobody notices until users do. So I didn't anchor on the design file. I anchored on the running app." },
        { id: "architecture", title: "I built it as a tree, one repo per part.", scene: "architecture", audio: "/portfolio/walkthroughs/sorb/step-02.mp3", durationMs: 22831,
          body: "I built four pieces on a shared contract so they can't drift apart: Canopy, the Figma plugin; Juice, the bridge server; Leaf, the React SDK; and Seed, the capture-and-resolve layer — all sitting on a Core typedef contract. It's a polyrepo by design, so any package can go public or private on its own." },
        { id: "plugin", title: "The designer edits a token, in Figma.", poster: "/portfolio/walkthroughs/sorb/screens/plugin.png", audio: "/portfolio/walkthroughs/sorb/step-03.mp3", durationMs: 19174,
          body: "Canopy is the Figma plugin — a sandboxed main-thread script and an iframe UI, with the Figma API kept strictly to the main thread. A designer edits a token variable right there, and the plugin posts the proposed tokens to a local bridge on port 7777." },
        { id: "preview", title: "Edit a token, the running app re-themes in place.", poster: "/portfolio/walkthroughs/sorb/screens/preview-after.jpg", audio: "/portfolio/walkthroughs/sorb/step-04.mp3", durationMs: 20323, money: "after",
          body: "This is the whole point. Leaf, the React SDK provider, fetches the proposed tokens and applies them as CSS custom properties on the root element, then live-polls for updates. The real components re-skin in place — before anyone merges. Not a mockup. The running app." },
        { id: "fallback", title: "Preview never breaks production.", poster: "/portfolio/walkthroughs/sorb/screens/pr.png", audio: "/portfolio/walkthroughs/sorb/step-05.mp3", durationMs: 21969,
          body: "The decision I'm proudest of is the fail-safe. Every token resolves through a CSS variable with a committed fallback — so if the bridge isn't running, the SDK falls back silently to the committed tokens. An experiment can never break production. And one command opens a GitHub PR with the new token file." },
        { id: "two-modes", title: "One binary, free-and-local or hosted-and-multi-tenant.", scene: "twoModes", audio: "/portfolio/walkthroughs/sorb/step-06.mp3", durationMs: 22100,
          body: "Juice, the Hono bridge, runs two ways from one codebase. Locally it's a dev-dependency only, single-tenant, and never touches production. The moment a database URL is set, the same binary turns on auth, entitlements, and scoped CORS and becomes the multi-tenant hosted plane." },
        { id: "agents", title: "I exposed the whole thing to agents over MCP.", scene: "agents", audio: "/portfolio/walkthroughs/sorb/step-07.mp3", durationMs: 23641,
          body: "I wrapped the bridge in MCP servers so an agent can drive it. And I made the running app the oracle: for the first write feature, a contrast fixer, the judge is the deterministic WCAG math, not the model. The AI proposes; a human reviews; the live app verifies — no auto-apply anywhere." },
        { id: "result", title: "Shipped, and honest about what isn't.", poster: "/portfolio/walkthroughs/sorb/screens/npm.png", audio: "/portfolio/walkthroughs/sorb/step-08.mp3", durationMs: 28421,
          body: "The core is shipped: five @sorb packages published to npm through OIDC trusted publishing — the four lifecycle packages plus a Storybook addon — a React SDK and Figma plugin in real use, and a live multi-tenant platform with a public demo at demo.sorbcloud.com. The deeper AI write features are built and gated, not merged — I won't market a capability the product doesn't actually run yet." },
      ],
    });
  </script>
</body>
</html>
