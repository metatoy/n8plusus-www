<title>Callout — walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

</head>
<body>
  <div id="wt"></div>
  <script src="/portfolio/walkthroughs/callout/scenes.js"></script>
  <script src="/portfolio/walkthroughs/walkthrough.js"></script>
  <script>
    Walkthrough({
      mount: "#wt",
      id: "callout",
      scenes: window.WT_CALLOUT_SCENES,
      manifest: [
        { id: "overview", title: "What I built.", scene: "overview", audio: "/portfolio/walkthroughs/callout/step-01.mp3", durationMs: 25861,
          body: "I built Callout — the admin platform for launching rule-driven on-site promotions at a large media site. It's three tiers: an admin app I owned end to end, a serving API that decides what runs where, and a renderer that draws the unit for readers. The design goal I set from the start — a non-engineer configures a promotion and sees exactly how it'll look live, before anything ships." },
        { id: "listing", title: "The operator's home base.", poster: "/portfolio/walkthroughs/callout/screens/listing.png", audio: "/portfolio/walkthroughs/callout/step-02.mp3", durationMs: 19722,
          body: "I made the dashboard a single scannable table — every unit with its status, type, audience, schedule, and a live performance stat. The call I made here was legibility over density: an operator should know what's live, scheduled, or paused at a glance, without opening a thing." },
        { id: "wizard", title: "Taming a complex configuration.", poster: "/portfolio/walkthroughs/callout/screens/wizard.png", audio: "/portfolio/walkthroughs/callout/step-03.mp3", durationMs: 18469,
          body: "Authoring a unit was the hard UX problem — these promotions are conditional and deep. I broke it into a five-step guided flow — Information, Placement, Content, Targeting, Review — so a heavy configuration gets assembled one clear decision at a time, instead of a wall of raw fields." },
        { id: "editor", title: "The piece I'm proudest of.", poster: "/portfolio/walkthroughs/callout/screens/editor.png", audio: "/portfolio/walkthroughs/callout/step-04.mp3", durationMs: 26096,
          body: "The part I care about most is the live editor — a split view where the unit renders beside the edits, drawn by the very same renderer that serves readers. Type a headline, swap the theme, upload an image, and the on-site unit updates in real time. I built in autosave with session restore, undo and redo, and per-field validation, so a long configuration is never lost or left half-valid." },
        { id: "api", title: "The thesis: preview the real thing.", scene: "api", audio: "/portfolio/walkthroughs/callout/step-05.mp3", durationMs: 21734,
          body: "I built the whole system around one thesis — the preview has to be the real thing. When a unit ships, the serving API picks which one a given reader sees from the audience and targeting rules, and that same renderer draws it on the live page. There's no second code path, so no gap between what I previewed and what production serves." },
        { id: "results", title: "What it added up to.", scene: "results", audio: "/portfolio/walkthroughs/callout/step-06.mp3", durationMs: 21760,
          body: "What it added up to: non-engineers launch audience-targeted, scheduled promotions themselves, and the shared-renderer architecture designs out a whole class of \"it looked different in prod\" bugs. I owned the admin tier end to end — the listing, the guided builder, and the live editor." },
      ],
    });
  </script>
</body>
</html>
