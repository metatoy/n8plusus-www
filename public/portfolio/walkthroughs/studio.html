<body>
  <div id="wt"></div>
  <script src="/portfolio/walkthroughs/studio/scenes.js"></script>
  <script src="/portfolio/walkthroughs/walkthrough.js"></script>
  <script>
    Walkthrough({
      mount: "#wt",
      title: "Walkthrough: how the Metatoy studio's agent operating system runs a day",
      id: "studio",
      scenes: window.WT_STUDIO_SCENES,
      manifest: [
        { id: "subject", title: "The studio is the proof, not the pitch.", scene: "subject", audio: "/portfolio/walkthroughs/studio/step-01.mp3", durationMs: 25861,
          body: "Metatoy is a solo studio I run as a multi-agent software factory — and I mean it as the proof, not the pitch. One operator, running like an engineering org staffed by AI agents: around thirty repositories, eight backend services, a self-hosted skill-server with six connected tool servers, and nineteen user-facing surfaces. These are the capabilities that make that possible." },
        { id: "agentic", title: "Agentic loops & workflows — the core competency.", scene: "agentic", audio: "/portfolio/walkthroughs/studio/step-02.mp3", durationMs: 38531,
          body: "My core competency is designing autonomous systems that do real work without going off the rails. Work starts as an approved spec, then fans out into dev pods — a lead plus workers on isolated git worktrees with non-overlapping file partitions, a QA pass against a definition-of-done, one integrated PR — cast down a cost-tiered model ladder, with an idle loop running sandboxed experiments while the queue is clear. Every irreversible action — deploy, publish, merge, spend — is gated on a human." },
        { id: "brainstorm", title: "A brainstorming engine built to avoid groupthink.", scene: "brainstorm", audio: "/portfolio/walkthroughs/studio/step-03.mp3", durationMs: 33202,
          body: "The product thinking comes from a brainstorming engine. Parallel pods, each cast with personas chosen for deliberate cognitive diversity, run an opportunity-solution-tree ideation blind to each other — so when they converge, that agreement is real signal, not groupthink. Dozens of raw ideas collapse to a handful, each carrying its riskiest assumption and its cheapest experiment. I keep ideation structurally separate from evaluation, so judgment never contaminates divergence." },
        { id: "audits", title: "Competitive audits — strategy backed by evidence.", scene: "audits", audio: "/portfolio/walkthroughs/studio/step-04.mp3", durationMs: 30407,
          body: "Strategy backed by evidence, not vibes. A sourced, dated feature audit across an entire tool landscape, scored on a dozen capability axes, feeds a gap analysis — where the product is uncontested, where it competes, and where not to fight — that a review council turns into concrete roadmap placement. Every unverified cell is flagged and any claim headed for marketing is gated. I ran it in depth for Sorb's design-token tooling landscape." },
        { id: "ml", title: "Applied ML — a fifteen-year through-line.", scene: "ml", audio: "/portfolio/walkthroughs/studio/step-05.mp3", durationMs: 38687,
          body: "Is the AI real, or recent? A fifteen-year through-line answers it: sentiment classification on emerging-platform data in 2010, ML content recommendations shipped inside the publishing platform in 2018, and today's LLM classification and evaluation. In production that's the AI Support Triage agent — a learned rulebook the model reads, tuned against a locked golden set until routing accuracy climbed from fifty-four percent into the mid-seventies — and TattleTown's moderation, which fails safe to a human on anything legally sensitive." },
        { id: "genai", title: "Generative AI — shipped, and safe enough for users.", scene: "genai", audio: "/portfolio/walkthroughs/studio/step-06.mp3", durationMs: 45584,
          body: "GenAI features that are safe enough to put in front of real users. In woords, season stories, clues, and hints are authored by an in-house LLM pipeline in a locked per-season voice — every line cleared by no-spoiler and content-safety gates. In Sorb, the AI explains, reskins, and repairs design tokens by riding the running app's live token-to-component graph — always AI-proposes, human-reviews, live-verifies, never auto-applied. And I'm precise about the line: the puzzle generation itself is a deterministic constraint solver, not ML. Knowing what shouldn't be AI is part of the judgment." },
        { id: "flywheels", title: "Self-learning flywheels — what makes it a moat.", scene: "flywheels", audio: "/portfolio/walkthroughs/studio/step-07.mp3", durationMs: 42109, money: "after",
          body: "The systems I'm proudest of are the ones designed to compound — that's what separates a demo from a moat. Woords' tone flywheel turns every rating on a sampled clue into training signal: good clues become few-shot exemplars, bad ones become filter rules, so the machine writes more on-voice and I review less each cycle. The triage correction flywheel feeds every human correction back as fresh ground truth. And the studio meters itself — every pod logs cost and outcome to a ledger that reports work done per hundred-thousand tokens, kept honest by a memory-hygiene protocol." },
        { id: "infra", title: "Durable infrastructure I stand up myself.", scene: "infra", audio: "/portfolio/walkthroughs/studio/step-08.mp3", durationMs: 41561,
          body: "And I stand up my own AI infrastructure rather than renting all of it — which is where the systems engineering shows. A self-hosted Temporal engine makes long-running agent workflows durable and crash-resumable: woords' season pipeline runs on it end to end — select words, solve grids, write clues and hints, a hard automated QA gate, then a human-approval gate before publish. A self-hosted LangChain skill-server thinks on request over the local Claude CLI — no API key, no per-token cost — while Temporal owns durability. One operator, real infrastructure." },
      ],
    });
  </script>
</body>
</html>
